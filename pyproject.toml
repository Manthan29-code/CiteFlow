[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pyright]
extraPaths = ["Backend", "src"]

[tool.pyrefly]
search-paths = ["Backend", "src"]

[project]
name = "citeflow"
version = "0.1.0"
description = "Deterministic scholarly citation metadata to LaTeX bibitem generator & FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "psycopg>=3.1.18",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.8.0",
    "imagekitio>=4.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "langgraph",
    "langchain-core",
    "langgraph-checkpoint-postgres",
    "pymupdf>=1.23.0",
    "typer",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
]
pdf = [
    "pymupdf",
]

[project.scripts]
citegen = "citegen.cli:app"

[tool.setuptools.packages.find]
where = ["src", "Backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "part1: marks tests as part of Part 1 test suite",
    "part2: marks tests as part of Part 2 test suite",
    "live: marks tests calling live APIs (skipped by default)",
    "ocr: marks tests requiring OCR/Tesseract",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
