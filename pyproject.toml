[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pyright]
extraPaths = ["Backend", "src"]

[tool.pyrefly]
search-paths = ["Backend", "src"]

[project]
name = "citeflow"
version = "0.1.0"
description = "Deterministic scholarly citation metadata to LaTeX bibitem generator & FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "greenlet>=3.0.0",
    "alembic>=1.13.1",
    "psycopg>=3.1.18",
    "psycopg-pool>=3.1.18",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.8.0",
    "imagekitio>=4.0.0",
    "httpx>=0.27.0",
    "pymupdf>=1.23.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "langgraph",
    "langchain-core",
    "langgraph-checkpoint-postgres",
    "pypdf>=4.0.0",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
    "uvicorn[standard]>=0.28.0",
    "alembic>=1.13.1",
]
pdf = [
    "pymupdf>=1.23.0",
]

[project.scripts]
citegen = "citegen.cli:app"

[tool.setuptools.packages.find]
where = ["src", "Backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "part1: marks tests as part of Part 1 test suite",
    "part2: marks tests as part of Part 2 test suite",
    "live: marks tests calling live APIs (skipped by default)",
    "ocr: marks tests requiring OCR/Tesseract",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
